name: build-test-release

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试 (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 运行单元测试
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v

  build-windows:
    name: 云编译 Windows 版
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 PyInstaller
        run: pip install pyinstaller
      - name: 编译 GUI 版
        run: pyinstaller --noconfirm --clean --paths src --onefile --windowed --name SourceModManagerGUI run_gui.py
      - name: 编译 CLI 版
        run: pyinstaller --noconfirm --clean --paths src --onefile --name SourceModManagerCLI run_cli.py
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe

  build-linux:
    name: 云编译 Linux 版
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 Tkinter 与 PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install pyinstaller
      - name: 编译 GUI 版
        run: pyinstaller --noconfirm --clean --paths src --onefile --windowed --name SourceModManagerGUI run_gui.py
      - name: 编译 CLI 版
        run: pyinstaller --noconfirm --clean --paths src --onefile --name SourceModManagerCLI run_cli.py
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*

  release:
    name: 发布 Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/windows-build/* dist/linux-build/* --generate-notes
